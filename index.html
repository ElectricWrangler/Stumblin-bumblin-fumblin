<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05080e">
  <title>SBF Network</title>
  <meta name="description" content="The official fantasy football media home for Stumblin' Bumblin' & Fumblin'.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#home" data-route="home">
      <span class="brand-mark">SBF</span>
      <span class="brand-copy">
        <small>Fantasy Football</small>
        <strong>Network</strong>
      </span>
    </a>

    <nav class="desktop-nav" aria-label="Main navigation">
      <a href="#home" data-route="home" class="active">Home</a>
      <a href="#matchups" data-route="matchups">Matchups</a>
      <a href="#standings" data-route="standings">Standings</a>
      <a href="#teams" data-route="teams">Teams</a>
      <a href="#recaps" data-route="recaps">Recaps</a>
    </nav>

  <div class="ticker">

    <div>

      <span>CHAMPIONSHIP ODDS</span>
      <span>FRAUD WATCH</span>
      <span>WEEKLY AWARDS</span>

  <main id="app">
    <section id="home" class="page active"></section>
    <section id="matchups" class="page"></section>
    <section id="standings" class="page"></section>
    <section id="teams" class="page"></section>
    <section id="recaps" class="page"></section>
    <section id="nfl" class="page"></section>
  </main>

  <nav class="desktop-nav" aria-label="Main navigation">
  <a href="#home" data-route="home" class="active">Home</a>
  <a href="#matchups" data-route="matchups">Matchups</a>
  <a href="#standings" data-route="standings">Standings</a>
  <a href="#teams" data-route="teams">Teams</a>
  <a href="#recaps" data-route="recaps">Recaps</a>
  <a href="#nfl" data-route="nfl">NFL</a>
</nav><nav class="mobile-nav" aria-label="Mobile navigation">
  <a href="#home" data-route="home" class="active">
    <span>⌂</span>

  </a>

  <a href="#matchups" data-route="matchups">
    <span>▣</span>
    <small>Matchups</small>
  </a>

  <a href="#standings" data-route="standings">

    <small>Standings</small>
  </a>

  <a href="#teams" data-route="teams">

    <small>Teams</small>
  </a>

  </a>

  <a href="#nfl" data-route="nfl">
    <span>🏈</span>
    <small>NFL</small>

</nav>
