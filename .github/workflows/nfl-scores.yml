name: Update NFL Scores

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-nfl-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch NFL scores
        run: node scripts/update-nfl-scores.js

      - name: Commit updated scores
        run: |
          git config user.name "SBF ScoreCenter Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nfl-scores.json
          git diff --cached --quiet || git commit -m "Update NFL scores"
          git push